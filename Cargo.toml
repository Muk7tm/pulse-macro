[workspace]
resolver = "3"
members = [
    "crates/pulse-core",
    "crates/pulse-input",
    "crates/pulse-protocol",
    "crates/pulse-config",
    "crates/pulse-engine",
    "crates/pulse-cli",
    "crates/pulse-bench",
    "crates/pulse-ui",
]
default-members = [
    "crates/pulse-core",
    "crates/pulse-input",
    "crates/pulse-protocol",
    "crates/pulse-config",
    "crates/pulse-engine",
    "crates/pulse-cli",
    "crates/pulse-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://example.invalid/pulse"
authors = ["Pulse contributors"]

[workspace.dependencies]
pulse-core = { path = "crates/pulse-core" }
pulse-input = { path = "crates/pulse-input" }
pulse-protocol = { path = "crates/pulse-protocol" }
pulse-config = { path = "crates/pulse-config" }

x11rb = { version = "0.14", default-features = false, features = ["xtest", "xinput"] }
evdev = { version = "0.13", default-features = false }
rustix = { version = "1.1", features = ["event", "time", "net", "fs", "process", "thread", "pipe", "param"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
anyhow = "1.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
clap = { version = "4.6", features = ["derive"] }
proptest = "1.12"
signal-hook = { version = "0.4", default-features = false }
# Slint's default features pull in Qt/Wayland backends and more; Pulse needs
# only the X11 winit backend with both renderers selectable at startup.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit-x11",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }
slint-build = "1.18.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwinding is kept on purpose: destructors release held inputs on panic.
panic = "unwind"
strip = "symbols"
